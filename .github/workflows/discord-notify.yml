name: GeminiFit Discord Notifier

on:
  schedule:
    # GitHub Actions cron은 UTC 기준 (KST = UTC + 9)
    # 정각/30분 크론 폭주를 피해 비정각 + 다중 백업 크론 구성 (중복 발송은 discord_notify_state.json으로 차단)
    # 1) 모닝 브리핑 + 10초 일본어: 08:23 KST (1차) / 09:17 KST (2차 백업) / 10:41 KST (3차 백업) / 14:07 KST (오전 장애 복구 백업)
    - cron: '23 23 * * *'
    - cron: '17 0 * * *'
    - cron: '41 1 * * *'
    - cron: '7 5 * * *'
    # 2) 밤 스트릭 보호 스마트 넛지: 22:07 KST (1차) / 22:43 KST (2차 백업)
    - cron: '7 13 * * *'
    - cron: '43 13 * * *'
    # 3) 매주 일요일 주간 결산: 20:11 KST (1차) / 20:47 KST (2차 백업)
    - cron: '11 11 * * 0'
    - cron: '47 11 * * 0'

  # GitHub Actions 탭에서 언제든 수동 테스트 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 알림 모드 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - weekly
      force:
        description: 'evening 모드 강제 발송 (오늘 기록 있어도 테스트 전송)'
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine notification mode
        id: pick_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "23 23 * * *"|"17 0 * * *"|"41 1 * * *"|"7 5 * * *")
                echo "mode=morning" >> "$GITHUB_OUTPUT"
                ;;
              "7 13 * * *"|"43 13 * * *")
                echo "mode=evening" >> "$GITHUB_OUTPUT"
                ;;
              "11 11 * * 0"|"47 11 * * 0")
                echo "mode=weekly" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "mode=morning" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Install Korean font for weekly chart
        if: steps.pick_mode.outputs.mode == 'weekly'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          if [ "${{ steps.pick_mode.outputs.mode }}" = "weekly" ]; then
            pip install --quiet requests matplotlib
          else
            pip install --quiet requests
          fi

      - name: Run GeminiFit Discord Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              EXTRA_ARGS="--force"
            fi
          else
            EXTRA_ARGS="--skip-if-sent --record-state --enforce-window"
          fi
          python tools/discord_bot.py --mode "${{ steps.pick_mode.outputs.mode }}" $EXTRA_ARGS

      - name: Commit notification state (prevent duplicate backup runs)
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f tools/discord_notify_state.json ]; then
            git add tools/discord_notify_state.json
            git diff --staged --quiet || (git commit -m "chore: record discord notify state [skip ci]" && git push)
          fi
