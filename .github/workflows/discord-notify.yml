name: GeminiFit Discord Notifier

on:
  schedule:
    # GitHub Actions cron은 UTC 기준 (KST = UTC + 9)
    # 정각/30분 크론 폭주를 피해 비정각 + 목표 시각 앞뒤 30분 간격 다중 백업 크론 구성
    # (중복 발송은 discord_notify_state.json으로 차단, 지연 크론은 --enforce-window로 차단)
    # 1) 모닝 브리핑 + 10초 일본어 (목표 08:30 KST 앞뒤 30분 + 오전/오후 백업):
    #    07:53 / 08:23 / 08:53 / 09:27 / 10:19 / 12:13 / 14:07 KST
    - cron: '53 22 * * *'
    - cron: '23 23 * * *'
    - cron: '53 23 * * *'
    - cron: '27 0 * * *'
    - cron: '19 1 * * *'
    - cron: '13 3 * * *'
    - cron: '7 5 * * *'
    # 2) 밤 스트릭 보호 스마트 넛지 (목표 22:00 KST 앞뒤 30분 + 자정 전 백업):
    #    21:23 / 21:53 / 22:19 / 22:47 / 23:17 KST
    - cron: '23 12 * * *'
    - cron: '53 12 * * *'
    - cron: '19 13 * * *'
    - cron: '47 13 * * *'
    - cron: '17 14 * * *'
    # 3) 매주 일요일 주간 결산 (목표 20:00 KST 앞뒤 30분 + 백업):
    #    19:23 / 19:53 / 20:19 / 20:51 / 21:37 KST
    - cron: '23 10 * * 0'
    - cron: '53 10 * * 0'
    - cron: '19 11 * * 0'
    - cron: '51 11 * * 0'
    - cron: '37 12 * * 0'

  # GitHub Actions 탭에서 언제든 수동 테스트 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 알림 모드 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - weekly
      force:
        description: 'evening 모드 강제 발송 (오늘 기록 있어도 테스트 전송)'
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine notification mode
        id: pick_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "53 22 * * *"|"23 23 * * *"|"53 23 * * *"|"27 0 * * *"|"19 1 * * *"|"13 3 * * *"|"7 5 * * *")
                echo "mode=morning" >> "$GITHUB_OUTPUT"
                ;;
              "23 12 * * *"|"53 12 * * *"|"19 13 * * *"|"47 13 * * *"|"17 14 * * *")
                echo "mode=evening" >> "$GITHUB_OUTPUT"
                ;;
              "23 10 * * 0"|"53 10 * * 0"|"19 11 * * 0"|"51 11 * * 0"|"37 12 * * 0")
                echo "mode=weekly" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "mode=morning" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Install Korean font for weekly chart
        if: steps.pick_mode.outputs.mode == 'weekly'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          if [ "${{ steps.pick_mode.outputs.mode }}" = "weekly" ]; then
            pip install --quiet requests matplotlib
          else
            pip install --quiet requests
          fi

      - name: Run GeminiFit Discord Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              EXTRA_ARGS="--force"
            else
              EXTRA_ARGS="--record-state"
            fi
          else
            EXTRA_ARGS="--skip-if-sent --record-state --enforce-window"
          fi
          python tools/discord_bot.py --mode "${{ steps.pick_mode.outputs.mode }}" $EXTRA_ARGS

      - name: Commit notification state (prevent duplicate backup runs)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f tools/discord_notify_state.json ]; then
            git add tools/discord_notify_state.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: record discord notify state [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
